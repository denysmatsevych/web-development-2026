<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShowFinder — TV series search in TVmaze</title>
    <meta name="description" content="TV series search via TVmaze API: list of shows and show page." />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
    <!-- The browser executes JavaScript compiled by tsc into dist/ (npm run watch), not src/*.ts. -->
    <script
      type="module"
      src="dist/main.js"
      onerror="document.getElementById('status').textContent = 'dist/main.js is missing: run npm run watch (README.md).'"
    ></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container site-header__inner">
        <h1 class="site-title">ShowFinder</h1>
        <p class="site-tagline">TV series search in TVmaze</p>
      </div>
    </header>

    <main class="container page">
      <form id="search" class="search" role="search" aria-label="TV series search">
        <label for="search-query">Series title</label>
        <div class="search__row">
          <input id="search-query" name="query" type="search" autocomplete="off" spellcheck="false" />
          <button type="submit" class="btn btn--primary">Search</button>
        </div>
      </form>
      <p id="status" class="status" role="status"></p>
      <div id="content" class="content"></div>
    </main>

    <footer class="site-footer container">
      <p>
        Data: <a href="https://www.tvmaze.com">TVmaze</a>
        (<a href="https://www.tvmaze.com/api">TVmaze API</a>), licensed under
        <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.
      </p>
    </footer>
  </body>
</html>
