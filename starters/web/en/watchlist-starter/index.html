<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Watchlist — TVmaze shows</title>
    <meta name="description" content="A catalog of 30 TVmaze shows with search, a personal watchlist, and notes." />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container site-header__inner">
        <h1 class="site-title">My Watchlist</h1>
        <p class="counter">In list: <span id="watchlist-count">0</span></p>
      </div>
    </header>

    <main class="container">
      <form id="filters" class="filters" role="search" aria-label="Search shows">
        <div class="field">
          <label for="filter-query">Title</label>
          <input id="filter-query" name="query" type="search" autocomplete="off" spellcheck="false" />
        </div>
        <div class="field">
          <label for="filter-genre">Genre</label>
          <select id="filter-genre" name="genre">
            <option value="">All genres</option>
            <option>Action</option>
            <option>Adventure</option>
            <option>Anime</option>
            <option>Comedy</option>
            <option>Crime</option>
            <option>Drama</option>
            <option>Family</option>
            <option>Fantasy</option>
            <option>History</option>
            <option>Horror</option>
            <option>Medical</option>
            <option>Music</option>
            <option>Mystery</option>
            <option>Science-Fiction</option>
            <option>Supernatural</option>
            <option>Thriller</option>
            <option>War</option>
          </select>
        </div>
        <div class="field field--check">
          <input id="filter-mine" name="mine" type="checkbox" />
          <label for="filter-mine">Only my watchlist</label>
        </div>
        <button type="reset" class="btn">Reset</button>
      </form>

      <h2 id="results-heading" class="results-heading">Shows</h2>
      <p id="status" class="status" role="status"></p>
      <ul id="results" class="cards" aria-labelledby="results-heading"></ul>
    </main>

    <footer class="site-footer container">
      <p>
        Data: <a href="https://www.tvmaze.com">TVmaze</a>, licensed under
        <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>. Adapted: 30
        of 240 shows, selected fields only.
      </p>
    </footer>

    <template id="show-card">
      <li class="card" data-id="">
        <h3 class="card__title" data-field="name"></h3>
        <p class="card__meta">
          <span data-field="year"></span> · <span data-field="genres"></span>
        </p>
        <p class="card__rating">TVmaze rating: <span data-field="rating"></span></p>
        <p class="card__mine" hidden>My rating: <strong data-field="my-rating"></strong>/10</p>
        <p class="card__note" data-field="note" hidden></p>
        <div class="card__actions">
          <button type="button" class="btn btn--toggle" data-action="toggle" aria-pressed="false">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M6.5 3.5h11a1 1 0 0 1 1 1v16l-6.5-4-6.5 4v-16a1 1 0 0 1 1-1z" />
            </svg>
            Add to list<span class="visually-hidden">: <span data-field="name"></span></span>
          </button>
          <button type="button" class="btn" data-action="details">
            Details<span class="visually-hidden"> about <span data-field="name"></span></span>
          </button>
        </div>
      </li>
    </template>

    <dialog id="details" class="details" aria-labelledby="details-title">
      <h2 id="details-title" class="details__title"></h2>
      <div id="details-summary" class="details__summary"></div>
      <p class="details__source">
        <a id="details-link" href="https://www.tvmaze.com">Show page on TVmaze</a>
      </p>
      <form id="note-form" class="note-form">
        <h3 class="note-form__title">My rating and note</h3>
        <div class="field">
          <label for="note-rating">My rating (a whole number from 1 to 10)</label>
          <input id="note-rating" name="rating" type="number" min="1" max="10" step="1" required />
          <p id="note-rating-error" class="field__error"></p>
        </div>
        <div class="field">
          <label for="note-text">Note (up to 140 characters, optional)</label>
          <textarea id="note-text" name="note" rows="3" maxlength="140"></textarea>
        </div>
        <div class="note-form__actions">
          <button type="submit" class="btn btn--primary">Save</button>
          <button type="button" class="btn">Cancel</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
