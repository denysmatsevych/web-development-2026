<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShowFinder — offline mode</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      .banner {
        margin: 0;
        padding: 0.5rem 1rem;
        color: #1b1f27;
        background: #ffe08a;
      }

      iframe {
        flex: 1;
        width: 100%;
        border: 0;
      }
    </style>
    <!--
      The same index.html, but requests to TVmaze get recorded responses from check/fixtures/
      after 0.25–0.9 s (check/net.js). For the class session, when TVmaze limits requests from one
      address (429) or there is no network. You don't need to change this file.
    -->
    <script type="module">
      const frame = document.querySelector('iframe');
      const response = await fetch('index.html', { cache: 'no-store' });
      const html = await response.text();
      frame.srcdoc = html.replace(/<head(\s[^>]*)?>/i, (tag) => `${tag}<script src="check/net.js" data-offline><\/script>`);
    </script>
  </head>
  <body>
    <p class="banner">
      <strong>Offline mode:</strong> the TVmaze responses are recorded in advance (a few searches and six
      shows with episodes). The report and the Network checklist need <code>index.html</code>.
    </p>
    <iframe title="ShowFinder in offline mode"></iframe>
  </body>
</html>
