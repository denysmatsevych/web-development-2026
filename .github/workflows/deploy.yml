name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build and upload site
        uses: withastro/action@v6
        env:
          # Optional. PageSpeed Insights key for the ЛР-7 auto-check's
          # Lighthouse rows (src/scripts/courtly-check.ts). It ships in the
          # client bundle, so restrict it by HTTP referrer in Google Cloud;
          # a repository variable, not a secret, is enough.
          PUBLIC_PSI_API_KEY: ${{ vars.PSI_API_KEY }}
        with:
          node-version: "24"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
