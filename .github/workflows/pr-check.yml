name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type and content check
        run: npm run check

      - name: Build
        run: npm run build

      # The production build must stay Ukrainian-only: no /en/ pages.
      - name: Production build has no English pages
        run: test ! -d dist/en

      # Validation only: never uploaded or deployed. Builds the English
      # routes too, so broken /en/ pages or translated content in a
      # translation PR fail here instead of after merge.
      - name: Build with English pages (validation only)
        run: npm run build
        env:
          VITE_ENABLE_ENGLISH: "true"

      - name: English build contains English pages
        run: test -d dist/en