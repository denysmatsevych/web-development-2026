<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShowFinder — пошук серіалів у TVmaze</title>
    <meta name="description" content="Пошук серіалів через TVmaze API: список знайдених серіалів і сторінка серіалу." />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
    <!-- Браузер виконує JavaScript, який tsc кладе в dist/ (npm run watch), а не src/*.ts. -->
    <script
      type="module"
      src="dist/main.js"
      onerror="document.getElementById('status').textContent = 'Немає dist/main.js: запустіть npm run watch (README.md).'"
    ></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container site-header__inner">
        <h1 class="site-title">ShowFinder</h1>
        <p class="site-tagline">Пошук серіалів у TVmaze</p>
      </div>
    </header>

    <main class="container page">
      <form id="search" class="search" role="search" aria-label="Пошук серіалів">
        <label for="search-query">Назва серіалу</label>
        <div class="search__row">
          <input id="search-query" name="query" type="search" autocomplete="off" spellcheck="false" />
          <button type="submit" class="btn btn--primary">Знайти</button>
        </div>
      </form>
      <p id="status" class="status" role="status"></p>
      <div id="content" class="content"></div>
    </main>

    <footer class="site-footer container">
      <p>
        Дані: <a href="https://www.tvmaze.com">TVmaze</a>
        (<a href="https://www.tvmaze.com/api">TVmaze API</a>), ліцензія
        <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.
      </p>
    </footer>
  </body>
</html>
